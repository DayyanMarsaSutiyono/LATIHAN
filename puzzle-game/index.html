<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Puzzle 3x3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Puzzle 3x3</h1>
    <div class="controls">
      <button id="shuffleBtn">Acak</button>
      <button id="solveBtn">Reset</button>
      <div id="moves">Gerakan: 0</div>
    </div>
    <div id="puzzle" class="puzzle" aria-label="puzzle grid"></div>
    <div id="message" class="message"></div>
    <small class="hint">Klik ubin yang bersebelahan kosong untuk memindahkannya.</small>
  </div>
  <script src="script.js"></script>
</body>
</html>
