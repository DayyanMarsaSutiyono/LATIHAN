<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Klasifikasi Berat Kendaraan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <div class="container login-page">
        <div class="login-card">
            <div class="logo">🚛</div>
            <h1>Login Aplikasi Klasifikasi Berat Kendaraan</h1>
            <p class="subtitle">Masuk sebagai Sopir atau User untuk mengakses fitur form, dashboard, map, dan identifikasi kendaraan.</p>

            <div class="role-switcher">
                <button type="button" class="role-btn active" data-role="sopir">Sopir</button>
                <button type="button" class="role-btn" data-role="user">User</button>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="hidden" id="userRole" name="role" value="sopir">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn-primary btn-large">Masuk</button>
            </form>

            <div class="auth-help">
                <p>Login demo: <strong>sopir / sopir123</strong> atau <strong>user / user123</strong></p>
            </div>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
